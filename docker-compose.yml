version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    ports:
      - "3000:3000"
    env_file:
      - ./ticket-service/.env
    depends_on:
      - mongodb
      - rabbitmq

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "4000:4000"
    env_file:
      - ./user-service/.env
    depends_on:
      - mongodb

volumes:
  mongo_data: