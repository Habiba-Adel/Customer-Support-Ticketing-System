server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Remove the trailing slashes from the proxy_pass URLs
    location /api/users {
        proxy_pass http://user-service:4000;
        proxy_set_header Host $host;
    }

    location /api/tickets {
        proxy_pass http://ticket-service:3003;
        proxy_set_header Host $host;
    }

    location /api/support {
        proxy_pass http://support-service:3002;
        proxy_set_header Host $host;
    }

    location /api/notifications {
        proxy_pass http://notification-service:3001;
        proxy_set_header Host $host;
    }

    location /api/reports {
        proxy_pass http://reporting-service:3005;
        proxy_set_header Host $host;
    }
}